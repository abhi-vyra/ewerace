<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>JEERACE 3D</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        #07121dcc,
        #000
    );

    color:white;
}

#menu h1{
    margin:0;
    font-size:55px;
    letter-spacing:5px;
}

#menu p{
    margin:10px 0 30px;
    opacity:.8;
}

#play{
    border:0;
    border-radius:15px;
    padding:15px 40px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:5;

    display:none;

    color:white;
    background:#0009;

    padding:12px 16px;
    border-radius:12px;

    font-size:17px;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:25px;

    z-index:5;

    display:none;

    justify-content:space-between;

    padding:0 25px;
}

.controlGroup{
    display:flex;
    gap:15px;
}

.ctrl{
    width:70px;
    height:70px;

    border-radius:50%;
    border:2px solid #ffffff66;

    background:#0009;
    color:white;

    font-size:28px;
    font-weight:bold;

    user-select:none;
    -webkit-user-select:none;
}

.ctrl:active{
    background:#ffffff55;
}

#hint{
    position:fixed;
    bottom:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    color:white;
    background:#0008;

    padding:7px 12px;
    border-radius:8px;

    font-size:13px;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="menu">

    <h1>JEERACE</h1>

    <p>3D JEEP DRIVING</p>

    <button id="play">
        PLAY
    </button>

</div>

<div id="hud">

    SPEED:
    <span id="speed">0</span>
    km/h

    <br>

    DISTANCE:
    <span id="distance">0</span>
    m

</div>

<div id="controls">

    <div class="controlGroup">

        <button class="ctrl" id="left">
            ◀
        </button>

        <button class="ctrl" id="right">
            ▶
        </button>

    </div>

    <div class="controlGroup">

        <button class="ctrl" id="brake">
            ▼
        </button>

        <button class="ctrl" id="gas">
            ▲
        </button>

    </div>

</div>

<div id="hint">
PC: W A S D / Arrow Keys
</div>


<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let jeep;

let speed = 0;
let distance = 0;

let started = false;


const keys = {

    forward:false,
    backward:false,
    left:false,
    right:false

};


/* =========================
   SCENE
========================= */

scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        80,
        300
    );


/* =========================
   CAMERA
========================= */

camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        0.1,
        500
    );

camera.position.set(
    0,
    5,
    10
);


/* =========================
   RENDERER
========================= */

renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* =========================
   LIGHT
========================= */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    30,
    60,
    20
);

sun.castShadow = true;

scene.add(sun);


const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.2
    );

scene.add(ambient);


/* =========================
   GROUND
========================= */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            500,
            500
        ),

        new THREE.MeshStandardMaterial({
            color:0x3f7f3f
        })

    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================
   ROAD
========================= */

const road =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            18,
            500
        ),

        new THREE.MeshStandardMaterial({
            color:0x303030
        })

    );

road.rotation.x =
    -Math.PI / 2;

road.position.y =
    0.02;

scene.add(road);


/* =========================
   ROAD LINES
========================= */

for(
    let z = -240;
    z < 250;
    z += 12
){

    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.3,
                0.03,
                6
            ),

            new THREE.MeshStandardMaterial({
                color:0xffffff
            })

        );

    line.position.set(
        0,
        0.06,
        z
    );

    scene.add(line);

}


/* =========================
   TREES
========================= */

function makeTree(x,z){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                0.35,
                0.5,
                3,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x654321
            })

        );

    trunk.position.set(
        x,
        1.5,
        z
    );

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                2.2,
                10,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x176b25
            })

        );

    leaves.position.set(
        x,
        4,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);

}


for(
    let z = -230;
    z < 240;
    z += 18
){

    makeTree(
        -15,
        z
    );

    makeTree(
        15,
        z + 7
    );

}


/* =========================
   JEEP
========================= */

function createJeep(){

    const group =
        new THREE.Group();


    /* BODY */

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                3.2,
                1.1,
                5
            ),

            new THREE.MeshStandardMaterial({
                color:0xd18b18
            })

        );

    body.position.y =
        1.25;

    body.castShadow = true;

    group.add(body);


    /* CABIN */

    const cabin =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.7,
                1.3,
                2.5
            ),

            new THREE.MeshStandardMaterial({
                color:0x222222
            })

        );

    cabin.position.set(
        0,
        2.25,
        0.2
    );

    cabin.castShadow = true;

    group.add(cabin);


    /* FRONT WINDOW */

    const windowMaterial =
        new THREE.MeshStandardMaterial({
            color:0x75b9d6,
            metalness:0.2,
            roughness:0.2
        });


    const frontWindow =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.3,
                0.7,
                0.08
            ),

            windowMaterial

        );

    frontWindow.position.set(
        0,
        2.35,
        -1.1
    );

    group.add(frontWindow);


    /* WHEELS */

    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color:0x111111
        });


    const wheelPositions = [

        [-1.65,0.75,-1.6],
        [1.65,0.75,-1.6],

        [-1.65,0.75,1.6],
        [1.65,0.75,1.6]

    ];


    wheelPositions.forEach(
        function(position){

            const wheel =
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        0.65,
                        0.65,
                        0.45,
                        16
                    ),

                    wheelMaterial

                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                position[0],
                position[1],
                position[2]
            );

            wheel.castShadow = true;

            group.add(wheel);

        }
    );


    /* HEADLIGHTS */

    const lightMaterial =
        new THREE.MeshStandardMaterial({

            color:0xffffaa,

            emissive:0xffff66,

            emissiveIntensity:1

        });


    [-1,1].forEach(
        function(x){

            const light =
                new THREE.Mesh(

                    new THREE.SphereGeometry(
                        0.25,
                        10,
                        10
                    ),

                    lightMaterial

                );

            light.position.set(
                x * 0.9,
                1.35,
                -2.55
            );

            group.add(light);

        }
    );


    group.position.set(
        0,
        0,
        30
    );

    scene.add(group);

    return group;

}


jeep =
    createJeep();


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "w" ||
            event.key === "W" ||
            event.key === "ArrowUp"
        ){
            keys.forward = true;
        }


        if(
            event.key === "s" ||
            event.key === "S" ||
            event.key === "ArrowDown"
        ){
            keys.backward = true;
        }


        if(
            event.key === "a" ||
            event.key === "A" ||
            event.key === "ArrowLeft"
        ){
            keys.left = true;
        }


        if(
            event.key === "d" ||
            event.key === "D" ||
            event.key === "ArrowRight"
        ){
            keys.right = true;
        }

    }
);


window.addEventListener(
    "keyup",
    function(event){

        if(
            event.key === "w" ||
            event.key === "W" ||
            event.key === "ArrowUp"
        ){
            keys.forward = false;
        }


        if(
            event.key === "s" ||
            event.key === "S" ||
            event.key === "ArrowDown"
        ){
            keys.backward = false;
        }


        if(
            event.key === "a" ||
            event.key === "A" ||
            event.key === "ArrowLeft"
        ){
            keys.left = false;
        }


        if(
            event.key === "d" ||
            event.key === "D" ||
            event.key === "ArrowRight"
        ){
            keys.right = false;
        }

    }
);


/* =========================
   MOBILE CONTROLS
========================= */

function touchButton(
    id,
    key
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(event){

            event.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        function(event){

            event.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            keys[key] = false;

        }
    );

}


touchButton(
    "gas",
    "forward"
);

touchButton(
    "brake",
    "backward"
);

touchButton(
    "left",
    "left"
);

touchButton(
    "right",
    "right"
);


/* =========================
   GAME UPDATE
========================= */

function update(){

    if(!started){

        return;

    }


    /* ACCELERATION */

    if(keys.forward){

        speed += 0.012;

    }

    else if(keys.backward){

        speed -= 0.018;

    }

    else{

        speed *= 0.985;

    }


    /* SPEED LIMIT */

    speed =
        Math.max(
            -0.35,
            Math.min(
                speed,
                0.65
            )
        );


    /* STEERING */

    if(
        Math.abs(speed) > 0.01
    ){

        if(keys.left){

            jeep.rotation.y +=
                0.025 *
                Math.sign(speed);

        }


        if(keys.right){

            jeep.rotation.y -=
                0.025 *
                Math.sign(speed);

        }

    }


    /* MOVE */

    jeep.translateZ(-speed);


    distance +=
        Math.abs(speed);


    /* ROAD LIMIT */

    jeep.position.x =
        Math.max(
            -6,
            Math.min(
                6,
                jeep.position.x
            )
        );


    /* CAMERA */

    const cameraOffset =
        new THREE.Vector3(
            0,
            4.8,
            9
        );


    cameraOffset.applyQuaternion(
        jeep.quaternion
    );


    cameraOffset.add(
        jeep.position
    );


    camera.position.lerp(
        cameraOffset,
        0.08
    );


    const lookAt =
        jeep.position.clone();


    lookAt.y += 1.3;


    camera.lookAt(
        lookAt
    );


    /* HUD */

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(speed) * 120
        );


    document.getElementById(
        "distance"
    ).textContent =
        Math.round(
            distance
        );

}


/* =========================
   GAME LOOP
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================
   PLAY BUTTON
========================= */

document
    .getElementById("play")
    .addEventListener(
        "click",
        function(){

            started = true;

            document
                .getElementById("menu")
                .style.display = "none";

            document
                .getElementById("hud")
                .style.display = "block";

            document
                .getElementById("controls")
                .style.display = "flex";

            document
                .getElementById("hint")
                .style.display = "block";

        }
    );


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
