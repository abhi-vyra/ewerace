<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>JEERACE 3D</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#07121dcc,#000);
    color:white;
}

#menu h1{
    margin:0;
    font-size:55px;
    letter-spacing:5px;
}

#menu p{
    margin:10px 0 30px;
    opacity:.8;
}

#play{
    border:0;
    border-radius:15px;
    padding:15px 40px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:5;
    display:none;
    color:white;
    background:#0009;
    padding:12px 16px;
    border-radius:12px;
    font-size:17px;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:25px;
    z-index:5;
    display:none;
    justify-content:space-between;
    padding:0 25px;
}

.controlGroup{
    display:flex;
    gap:15px;
}

.ctrl{
    width:70px;
    height:70px;
    border-radius:50%;
    border:2px solid #ffffff66;
    background:#0009;
    color:white;
    font-size:28px;
    font-weight:bold;
    user-select:none;
}

.ctrl:active{
    background:#ffffff55;
}

#hint{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    color:white;
    background:#0008;
    padding:7px 12px;
    border-radius:8px;
    font-size:13px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
    <h1>JEERACE</h1>
    <p>3D JEEP DRIVING</p>
    <button id="play">PLAY</button>
</div>

<div id="hud">
    SPEED: <span id="speed">0</span> km/h<br>
    DISTANCE: <span id="distance">0</span> m
</div>

<div id="controls">

    <div class="controlGroup">
        <button class="ctrl" id="left">◀</button>
        <button class="ctrl" id="right">▶</button>
    </div>

    <div class="controlGroup">
        <button class="ctrl" id="brake">▼</button>
        <button class="ctrl" id="gas">▲</button>
    </div>

</div>

<div id="hint">
PC: W A S D / Arrow Keys
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let jeep;

let speed = 0;
let distance = 0;
let started = false;

const keys = {
    forward:false,
    backward:false,
    left:false,
    right:false
};


/* =========================
   SCENE
========================= */

scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        80,
        350
    );


/* =========================
   CAMERA
========================= */

camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        0.1,
        500
    );

camera.position.set(0,5,10);


/* =========================
   RENDERER
========================= */

renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================
   LIGHT
========================= */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    30,
    60,
    20
);

sun.castShadow = true;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.2
    )
);


/* =========================
   GROUND
========================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1000,
            1000
        ),
        new THREE.MeshStandardMaterial({
            color:0x3f7f3f
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y = -0.02;

scene.add(ground);


/* =========================
   INFINITE ROAD
========================= */

const roadSegments = [];

const SEGMENT_LENGTH = 100;
const SEGMENT_COUNT = 7;

for(let i=0;i<SEGMENT_COUNT;i++){

    const road =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                18,
                SEGMENT_LENGTH
            ),
            new THREE.MeshStandardMaterial({
                color:0x303030
            })
        );

    road.rotation.x =
        -Math.PI / 2;

    road.position.set(
        0,
        0.02,
        -i * SEGMENT_LENGTH
    );

    scene.add(road);

    roadSegments.push(road);
}


/* =========================
   ROAD LINES
========================= */

const lineSegments = [];

for(let i=0;i<70;i++){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.3,
                0.03,
                6
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff
            })
        );

    line.position.set(
        0,
        0.06,
        30 - i * 12
    );

    scene.add(line);

    lineSegments.push(line);
}


/* =========================
   TREE CREATOR
========================= */

function createTree(x,z){

    const group =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.35,
                0.5,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x654321
            })
        );

    trunk.position.y = 1.5;

    group.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                10,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x176b25
            })
        );

    leaves.position.y = 4;

    leaves.castShadow = true;

    group.add(leaves);

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    return group;
}


/* =========================
   INFINITE TREES
========================= */

const trees = [];

for(let i=0;i<50;i++){

    const z =
        40 - i * 18;

    trees.push(
        createTree(-15,z)
    );

    trees.push(
        createTree(15,z-7)
    );
}


/* =========================
   JEEP
========================= */

function createJeep(){

    const group =
        new THREE.Group();


    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.2,
                1.1,
                5
            ),
            new THREE.MeshStandardMaterial({
                color:0xd18b18
            })
        );

    body.position.y = 1.25;
    body.castShadow = true;

    group.add(body);


    /* CABIN */

    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.7,
                1.3,
                2.5
            ),
            new THREE.MeshStandardMaterial({
                color:0x222222
            })
        );

    cabin.position.set(
        0,
        2.25,
        0.2
    );

    cabin.castShadow = true;

    group.add(cabin);


    /* WINDOW */

    const windowMat =
        new THREE.MeshStandardMaterial({
            color:0x75b9d6,
            metalness:0.2,
            roughness:0.2
        });

    const window =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.3,
                0.7,
                0.08
            ),
            windowMat
        );

    window.position.set(
        0,
        2.35,
        -1.1
    );

    group.add(window);


    /* WHEELS */

    const wheelMat =
        new THREE.MeshStandardMaterial({
            color:0x111111
        });

    const wheels = [
        [-1.65,0.75,-1.6],
        [1.65,0.75,-1.6],
        [-1.65,0.75,1.6],
        [1.65,0.75,1.6]
    ];

    wheels.forEach(p=>{

        const wheel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.65,
                    0.65,
                    0.45,
                    16
                ),
                wheelMat
            );

        wheel.rotation.z =
            Math.PI / 2;

        wheel.position.set(
            p[0],
            p[1],
            p[2]
        );

        wheel.castShadow = true;

        group.add(wheel);
    });


    /* HEADLIGHTS */

    const lightMat =
        new THREE.MeshStandardMaterial({
            color:0xffffaa,
            emissive:0xffff66,
            emissiveIntensity:1
        });

    [-1,1].forEach(x=>{

        const light =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.25,
                    10,
                    10
                ),
                lightMat
            );

        light.position.set(
            x * 0.9,
            1.35,
            -2.55
        );

        group.add(light);
    });


    group.position.set(
        0,
        0,
        30
    );

    scene.add(group);

    return group;
}

jeep = createJeep();


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="w" ||
            e.key==="W" ||
            e.key==="ArrowUp"
        )
            keys.forward=true;

        if(
            e.key==="s" ||
            e.key==="S" ||
            e.key==="ArrowDown"
        )
            keys.backward=true;

        if(
            e.key==="a" ||
            e.key==="A" ||
            e.key==="ArrowLeft"
        )
            keys.left=true;

        if(
            e.key==="d" ||
            e.key==="D" ||
            e.key==="ArrowRight"
        )
            keys.right=true;

    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="w" ||
            e.key==="W" ||
            e.key==="ArrowUp"
        )
            keys.forward=false;

        if(
            e.key==="s" ||
            e.key==="S" ||
            e.key==="ArrowDown"
        )
            keys.backward=false;

        if(
            e.key==="a" ||
            e.key==="A" ||
            e.key==="ArrowLeft"
        )
            keys.left=false;

        if(
            e.key==="d" ||
            e.key==="D" ||
            e.key==="ArrowRight"
        )
            keys.right=false;

    }
);


/* =========================
   MOBILE CONTROLS
========================= */

function touchButton(id,key){

    const b =
        document.getElementById(id);

    b.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    b.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );

    b.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );

    b.addEventListener(
        "pointerleave",
        ()=>{
            keys[key]=false;
        }
    );
}

touchButton("gas","forward");
touchButton("brake","backward");
touchButton("left","left");
touchButton("right","right");


/* =========================
   INFINITE WORLD
========================= */

function updateWorld(){

    const jeepZ =
        jeep.position.z;


    /* ROAD */

    roadSegments.forEach(
        segment=>{

            if(
                segment.position.z >
                jeepZ + 100
            ){

                segment.position.z -=
                    SEGMENT_LENGTH *
                    SEGMENT_COUNT;

            }

        }
    );


    /* ROAD LINES */

    lineSegments.forEach(
        line=>{

            if(
                line.position.z >
                jeepZ + 50
            ){

                line.position.z -=
                    70 * 12;

            }

        }
    );


    /* TREES */

    trees.forEach(
        tree=>{

            if(
                tree.position.z >
                jeepZ + 80
            ){

                tree.position.z -=
                    50 * 18;

            }

        }
    );

}


/* =========================
   GAME UPDATE
========================= */

function update(){

    if(!started)
        return;


    /* ACCELERATION */

    if(keys.forward){

        speed += 0.012;

    }
    else if(keys.backward){

        speed -= 0.018;

    }
    else{

        speed *= 0.985;

    }


    /* SPEED LIMIT */

    speed =
        Math.max(
            -0.35,
            Math.min(
                speed,
                0.65
            )
        );


    /* STEERING */

    if(
        Math.abs(speed)>0.01
    ){

        if(keys.left){

            jeep.rotation.y +=
                0.025 *
                Math.sign(speed);

        }

        if(keys.right){

            jeep.rotation.y -=
                0.025 *
                Math.sign(speed);

        }

    }


    /* MOVE */

    jeep.translateZ(-speed);


    distance +=
        Math.abs(speed);


    /* ROAD WIDTH */

    jeep.position.x =
        Math.max(
            -6,
            Math.min(
                6,
                jeep.position.x
            )
        );


    /* WORLD */

    updateWorld();


    /* CAMERA */

    const offset =
        new THREE.Vector3(
            0,
            4.8,
            9
        );

    offset.applyQuaternion(
        jeep.quaternion
    );

    offset.add(
        jeep.position
    );

    camera.position.lerp(
        offset,
        0.08
    );


    const lookAt =
        jeep.position.clone();

    lookAt.y += 1.3;

    camera.lookAt(
        lookAt
    );


    /* HUD */

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(speed)*120
        );

    document.getElementById(
        "distance"
    ).textContent =
        Math.round(
            distance
        );

}


/* =========================
   GAME LOOP
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================
   PLAY
========================= */

document
    .getElementById("play")
    .addEventListener(
        "click",
        ()=>{

            started=true;

            document
                .getElementById("menu")
                .style.display="none";

            document
                .getElementById("hud")
                .style.display="block";

            document
                .getElementById("controls")
                .style.display="flex";

        }
    );


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
